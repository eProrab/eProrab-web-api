services:
  postgres:
    image: postgres:16-alpine
    container_name: eprorab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eprorab}
      POSTGRES_USER: ${POSTGRES_USER:-eprorab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eprorab_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - eprorab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eprorab} -d ${POSTGRES_DB:-eprorab}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eprorab-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: ${ConnectionStrings__Default:-Host=postgres;Port=5432;Database=eprorab;Username=eprorab;Password=eprorab_dev_password}
      Jwt__Issuer: ${Jwt__Issuer:-eProrab.API}
      Jwt__Audience: ${Jwt__Audience:-eProrab.Client}
      Jwt__SigningKey: ${Jwt__SigningKey:-change_this_jwt_secret_key_minimum_32_characters_long_for_security}
      SeedAdmin__Email: ${SeedAdmin__Email:-admin@eprorab.az}
      SeedAdmin__Password: ${SeedAdmin__Password:-ChangeMe123!}
      OAuth__Google__ClientId: ${OAuth__Google__ClientId:-}
      OAuth__Google__ClientSecret: ${OAuth__Google__ClientSecret:-}
      OAuth__Facebook__AppId: ${OAuth__Facebook__AppId:-}
      OAuth__Facebook__AppSecret: ${OAuth__Facebook__AppSecret:-}
    ports:
      - "8080:8080"

volumes:
  eprorab-postgres-data:

